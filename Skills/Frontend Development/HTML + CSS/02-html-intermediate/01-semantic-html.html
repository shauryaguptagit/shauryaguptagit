<!--
TOPIC: Semantic HTML

Semantic tags clearly describe their purpose.
They improve:
- Accessibility
- SEO
- Code readability

Common semantic tags:
<header>, <nav>, <main>, <section>, <article>, <footer>
-->

<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <nav>
            <a href="#">Home</a> |
            <a href="#">About</a> |
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>About Me</h2>
            <p>
                I am learning HTML to build strong web fundamentals.
            </p>
        </section>

        <section>
            <h2>My Skills</h2>
            <article>
                <h3>HTML</h3>
                <p>Used to structure web content.</p>
            </article>
            <article>
                <h3>CSS</h3>
                <p>Used to style web pages.</p>
            </article>
        </section>

    </main>

    <footer>
        <p>© 2026 Shaurya Gupta</p>
    </footer>

    <!-- TASK:
    1. Replace any <div> you know with semantic tags
    2. Add one more section for hobbies or goals
    3. Add a footer note with your GitHub link
    -->
    
    <section>
        <h2>Shaurya Gupta</h2>
        <p>Fourth year student at MSIT</p>
    </section>

    <section>
        <ul>
            <li>Walking</li>
            <li>Fitness</li>
            <li>Sitcoms</li>
        </ul>
    </section>

    <footer><a href="www.github.com/shauryaguptagit">Shaurya's GitHub</a></footer>

</body>
</html>
