<!--
TOPIC: Data Attributes

Data attributes store custom data in HTML.
Format: data-*
Used widely in JavaScript interactions.
-->

<!DOCTYPE html>
<html>
<head>
    <title>Data Attributes</title>
</head>
<body>

    <h2 data-topic="html" data-level="beginner">
        HTML Learning
    </h2>

    <button data-action="submit">
        Submit
    </button>

    <!-- TASK:
    1. Add data attributes to list items
    2. Think how JS might use these later
    -->

    <ul>
        <li data-topic="name">Shaurya</li>
        <li data-topic="name">Neha</li>
        <li data-topic="name">Yash</li>
    </ul>
    
    <button data-action="submit">Submit</button>

</body>
</html>
