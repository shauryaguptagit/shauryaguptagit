<!--
TOPIC: SVG Basics

SVG graphics are scalable and resolution-independent.
Used for icons and illustrations.
-->

<!DOCTYPE html>
<html>
<head>
    <title>SVG Basics</title>
</head>
<body>

    <h2>SVG Circle</h2>

    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" fill="blue" />
    </svg>

    <!-- TASK:

    2. Try rectangle or line
    -->

    <svg>
        <rect width="100" height="100" fill="red" />
    </svg>

</body>
</html>
