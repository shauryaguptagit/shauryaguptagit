<!--
TOPIC: HTML Tables

Tables are used to display structured data.
Not recommended for layout design.
-->

<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>
<body>

    <h2>Student Skills Table</h2>

    <table border="1">
        <tr>
            <th>Skill</th>
            <th>Level</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>HTML</td>
            <td>Beginner</td>
            <td>Learning</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>Beginner</td>
            <td>Upcoming</td>
        </tr>
        <tr>
            <td>JavaScript</td>
            <td>Vanilla</td>
            <td>Mastery</td>
        </tr>
        <tr>
            <td>React JS</td>
            <td>Beginner</td>
            <td>Upcoming</td>
        </tr>
    </table>

    <!-- TASK:
    1. Add 2 more rows
    2. Create a table for daily schedule or subjects
    -->

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Year</th>
        </tr>
        <tr>
            <td>Shaurya Gupta</td>
            <td>2026</td>
        </tr>
    </table>

</body>
</html>
