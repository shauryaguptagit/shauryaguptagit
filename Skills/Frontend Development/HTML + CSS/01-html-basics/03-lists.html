<!--
TOPIC: HTML Lists

<ul> -> unordered list (bullets)
<ol> -> ordered list (numbers)
<li> -> list item
-->

<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h2>Skills I Want to Learn</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Daily Routine</h2>

    <ol>
        <li>Wake up</li>
        <li>Study</li>
        <li>Practice coding</li>
    </ol>

</body>
</html>
